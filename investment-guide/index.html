<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Guide | Redirecting…</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://www.hochzeitsfotograf.tirol/preisliste/26-27/">
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const requestedLang = params.get("lang");
      const storedLang = localStorage.getItem("site-lang");
      const nextLang = requestedLang === "en" || storedLang === "en" ? "en" : "de";
      const target = nextLang === "en" ? "/preisliste/26-27/?lang=en" : "/preisliste/26-27/";
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
